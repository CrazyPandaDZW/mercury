# Open-Meteo 支持的模型列表
models:
  - ecmwf_ifs04
  - gfs_seamless
  - jma_seamless
  - icon_seamless
  - gem_seamless

# API 配置
openmeteo:
  base_url: https://api.open-meteo.com/v1/forecast
  forecast_days: 3
  rate_limit_delay: 0.5  # 每秒最多2个请求

# 输出目录
data_dir: data/forecasts
metar_dir: data/metar
bias_dir: data/models
accuracy_dir: data/accuracy
